[project]
name = "hexlet-code"
version = "0.1.0"
description = "Page Analyzer: checks web pages for SEO suitability"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "sqlmodel>=0.0.27",
    "sqlalchemy[asyncio]>=2.0.40",
    "alembic>=1.17.1",
    "asyncpg>=0.31.0",
    "itsdangerous>=2.2.0",
    "beautifulsoup4>=4.15.0",
    "pydantic-settings>=2.12.0",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["page_analyzer*"]

[tool.setuptools.package-data]
page_analyzer = [
    "templates/*.html",
    "templates/**/*.html",
]
